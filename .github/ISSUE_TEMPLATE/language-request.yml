name: New Dreaming language request
description: Request support for another language offered by Dreaming
title: "[Language]: "
body:
  - type: markdown
    attributes:
      value: |
        Language support requires a public catalog, route mapping, page verification, automated tests, and manual browser testing.

        Do not include passwords, cookies, tokens, authorization headers, HAR files, downloaded premium content, or private account information.
  - type: input
    id: language
    attributes:
      label: Language name
      placeholder: Italian
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Public Dreaming route
      description: Include a public path only, without account or session query data.
      placeholder: /italian/browse
    validations:
      required: true
  - type: input
    id: catalog
    attributes:
      label: Public catalog URL, if known
      placeholder: https://app.dreaming.com/videos/prod/it.json
  - type: textarea
    id: views
    attributes:
      label: Views checked
      description: Note whether Browse, Library, Series, and series modals appear to share the existing structure.
    validations:
      required: true
  - type: input
    id: browser-platform
    attributes:
      label: Browser and operating system used for checking
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional public information
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data confirmation
      options:
        - label: I have not included credentials, cookies, tokens, authorization headers, HAR files, premium content, or private account information.
          required: true
