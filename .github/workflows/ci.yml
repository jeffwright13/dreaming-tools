name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit

      - name: Validate manifest
        run: |
          node --check src/core.js
          node --check src/content.js
          node --check src/options.js
          node --check vitest.config.js
          node -e "const manifest = require('./manifest.json'); const pkg = require('./package.json'); if (manifest.version !== pkg.version) throw new Error('Version mismatch'); console.log('Manifest and package versions match:', manifest.version)"
